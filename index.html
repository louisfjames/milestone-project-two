<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Checker | Home</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- FAVICON TO GO HERE -->

    <!-- custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <!-- Navigation - using Boostrap -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Festival Checker</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link active" href="index.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
                        <li class="nav-item"><a class="nav-link" href="#"><i class="fa-regular fa-compass"></i> Discover</a></li>
                        <li class="nav-item"><a class="nav-link" href="#"><i class="fa-regular fa-circle-question"></i> FAQ</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content - using Boostrap containers -->
    <main>
        <section>
            <!-- Website name and introduction -->
            <div class="text-center p-4 mb-4">
                <div class="p-4">
                    <h1>Festival Tracker</h1>
                </div>
                <div class="p-4">
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
                </div>
            </div>
                         
            <!-- Search controls-->
            <div class="row g-3 align-items-center mb-3 p-3">

                <!-- Search bar -->
                <div class="col-12 col-lg-5 offset-lg-1">
                    <input type="text" id="search-box" class="form-control form-control-lg" placeholder="Enter artist, festival, or city…"/>
                </div>

                <!-- Search mode toggle -->
                <div class="col-12 col-lg-3 d-flex justify-content-center justify-content-lg-star">
                    <select id="mode-toggle" class="form-select form-select-lg w-auto">
                        <option value="artist">Search by Artist</option>
                        <option value="festival">Search by Festival Name</option>
                        <option value="city">Search by City</option>
                    </select>
                </div>

                <!-- UK-only checkbox -->
                <div class="col-12 col-lg-auto d-flex justify-content-center justify-content-lg-start"> 
                    <label class="d-flex align-items-center gap-2 mb-0">
                        <input type="checkbox" id="uk-only-toggle">
                        <span class="fs-5">UK‑only Festivals</span>
                    </label>
                </div>
            </div>

            <!-- Search button -->
            <div class="text-center">
                <button id="search-btn" class="btn btn-primary btn-lg px-5 py-3"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </div>

        </section>

        <!-- Search results -->
        <div id="status"></div>

        <div id="results" class="results-grid"></div>

    </main>

    <!-- Footer - using Boostrap containers -->
    <footer class="mt-auto text-center py-4 pd-1">
        <div>
            <p>© 2026 Festival Checker</p>
        </div>
    </footer>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

     <!-- Font Awesome kit -->
    <script src="https://kit.fontawesome.com/9e82e4ab0b.js" crossorigin="anonymous"></script>

    <!-- JavaScript -->
    <script src="assets/js/script.js"></script>

</body>
</html>
